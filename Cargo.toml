[package]
name = "veriguard-agent"
version = "0.1.0"
edition = "2021"
description = "Veriguard 平台自有验证 Agent (forked from OpenAEV-Platform/agent@531f9d12)"
license = "Apache-2.0"

[dependencies]
reqwest = { version = "0.12.15", features = ["blocking", "rustls-tls", "rustls-tls-native-roots", "json"], default-features = false }
config = "0.15.0"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = {version = "1.0.140"}
log = { version = "0.4.22", features = ["kv"] }
hostname = "0.4.0"
network-interface = "2.0.3"
mid = "=3.0.7"
tracing-subscriber = { version = "0.3.18", features = ["json"] }
tracing-appender = "0.2.3"
rolling-file = "0.2.0"

# Veriguard 二开 (C1-Agent-1): 非对称密码学 + Mode C 离线包 + onboarding
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets", "zeroize"] }
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["std"] }
rusqlite = { version = "0.36", features = ["bundled"] }
thiserror = "1"
sha2 = "0.10"
base64 = "0.22"
dirs = "5"
clap = { version = "4.5", features = ["derive"] }

# Veriguard 二开 (C1-Agent-3): Mode C .vpack/.vresults envelope + ISO-8601 timestamps + UUID 校验
# A.7.4: `serde` feature 用于 blacklist::Entry round-trip DateTime<Utc> 到 executed-packs.json
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
uuid = { version = "1", default-features = false, features = ["std"] }

[target.'cfg(unix)'.dependencies]
# Veriguard 二开 (C1-Agent-2): mkfifo for implant result pipe
nix = { version = "0.29", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.0"
windows-service-detector = "0.1.0"

[dev-dependencies]
mockito = "1.7.0"
tempfile = "3"
assert_cmd = "2"
